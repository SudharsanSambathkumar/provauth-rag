[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provauth-rag"
version = "1.0.0"
description = "Provenance-aware authorization of derived knowledge in hybrid vector-graph RAG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sudharsan SambathKumar" }]
dependencies = ["numpy>=1.26", "scikit-learn>=1.4"]

[project.optional-dependencies]
app = ["streamlit>=1.35", "pandas>=2.0"]
figures = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
